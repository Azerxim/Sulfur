# Intégration continue : lint, mise en forme, tests et build à chaque push et pull request.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    env:
      # Le binaire Electron n'est pas nécessaire : les tests s'exécutent sous Node.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Mise en forme
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
