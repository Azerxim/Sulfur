# Contributor License Agreement (CLA.md) : chaque contributeur le signe une fois, par un commentaire
# sur sa première pull request. Les signatures sont enregistrées sur la branche cla-signatures.
name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target : le jeton a les droits d'écriture même pour une PR venant d'un fork.
  # Le code de la PR n'est jamais extrait ni exécuté.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Signature du CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/Azerxim/Sulfur/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # Le mainteneur et les bots n'ont pas à signer.
          allowlist: 'Azerxim,dependabot[bot],github-actions[bot]'
