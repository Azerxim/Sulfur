appId: fr.topazdev.sulfur
productName: Sulfur
copyright: Copyright © 2026 Maxime MALLET
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!src/*'
  - '!tests/*'
  - '!packages/*'
  - '!examples/*'
  - '!docs/*'
  - '!aliases.mjs'
  - '!node_modules/cpu-features/build/**'
  - '!node_modules/ssh2/lib/protocol/crypto/build/**'
  - '!{electron.vite.config,vitest.config,eslint.config}.*'
  - '!{.editorconfig,.prettierrc.json,.prettierignore,jsconfig.json}'
  - '!{README.md,README.fr.md,ROADMAP.md,ROADMAP.fr.md,CLAUDE.md,CLA.md,CONTRIBUTING.md,CONTRIBUTING.fr.md}'
asarUnpack:
  - resources/**
# Pas de recompilation des modules natifs pour Electron : serialport fournit des binaires N-API
# précompilés (compatibles avec Electron) pour chaque plateforme, et les modules natifs facultatifs
# de ssh2 (cpu-features, sshcrypto) ont un repli en JavaScript. Leur recompilation échoue en CI
# (buildcheck.gypi absent) ; les binaires compilés pour Node en local sont exclus du paquet.
npmRebuild: false
# Source des mises à jour (electron-updater) : releases GitHub. Les builds restent en --publish never :
# c'est la CI qui joint installeurs, latest*.yml et .blockmap à la release.
publish:
  provider: github
  owner: Azerxim
  repo: Sulfur
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  # Une image par taille standard (générées depuis resources/icon.png) : le thème d'icônes hicolor
  # n'a pas de dossier 1024x1024, une icône unique à cette taille n'est pas trouvée par le bureau.
  icon: build/icons
  category: Development
  syncDesktopName: true
  synopsis: Modular industrial protocol simulator (OPC UA, Modbus TCP, S7, MQTT, SNMP, HTTP, NTP, Syslog)
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  # Nom du fichier seulement : le paquet Debian lui-même reste « sulfur » (minuscules imposées).
  artifactName: ${productName}_${version}_${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    # Le zip produit latest-mac.yml, utilisé pour signaler les nouvelles versions sous macOS.
    - target: zip
      arch: [x64, arm64]
  # icon.png (1024 px) est converti en .icns par electron-builder.
  icon: resources/icon.png
  category: public.app-category.developer-tools
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
